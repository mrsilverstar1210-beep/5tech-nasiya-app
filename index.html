<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>5Tech Nasiya</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --sep: rgba(127, 127, 127, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 14px; }
  .input { background: var(--card); border-radius: 14px; padding: 14px 16px; display: flex; align-items: baseline; gap: 8px; }
  .input input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .input span { color: var(--hint); font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 7px 12px; background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .card { background: var(--card); border-radius: 14px; margin-top: 12px; overflow: hidden; }
  .card h2 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--sep); display: flex; justify-content: space-between; }
  .row { display: flex; align-items: baseline; padding: 11px 16px; border-bottom: 1px solid var(--sep); gap: 10px; }
  .row:last-child { border-bottom: 0; }
  .oy { width: 56px; color: var(--hint); font-weight: 600; }
  .oylik { flex: 1; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .oylik small { font-size: 12px; color: var(--hint); font-weight: 500; }
  .jami { color: var(--hint); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .best { display: block; color: var(--accent); font-size: 11px; font-weight: 700; white-space: nowrap; }
  .empty { text-align: center; color: var(--hint); padding: 40px 16px; }
  .note { color: var(--hint); font-size: 12px; text-align: center; margin-top: 16px; }
  .adm .card h2 { align-items: center; }
  .sw { position: relative; width: 44px; height: 26px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; border-radius: 13px; background: var(--sep); transition: .2s; }
  .sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .sw input:checked + span { background: var(--accent); }
  .sw input:checked + span::after { transform: translateX(18px); }
  .ust { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--sep); }
  .ust label { flex: 1; color: var(--hint); font-size: 13px; }
  .step { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--bg2); color: var(--text); font-size: 20px; font-weight: 700; }
  .ust input { width: 72px; text-align: center; border: 1px solid var(--sep); border-radius: 10px; padding: 7px 4px;
    background: var(--bg); color: var(--text); font-size: 18px; font-weight: 700; }
  .fz { padding: 10px 16px 12px; font-size: 12px; color: var(--hint); line-height: 1.7; }
  .fz b { color: var(--text); font-weight: 600; }
  .off { opacity: .45; }
  .save { display: none; width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 14px; background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>🧮 Nasiya hisobi</h1>
  <div class="sub">Mahsulot narxini so'mda kiriting</div>
  <label class="input"><input id="narx" inputmode="numeric" autocomplete="off" placeholder="0"><span>so'm</span></label>
  <div class="chips" id="oylar"></div>
  <div id="natija"></div>
  <div class="note" id="note"></div>
</main>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var cfg = { n: [], q: 1000, i: "" };
  try {
    var h = decodeURIComponent(location.hash.slice(1)).replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(h), bytes = new Uint8Array(bin.length);
    for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    cfg = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { /* bo'sh qoladi */ }


  if (cfg.a) { admin(); return; }
  var inp = document.getElementById("narx"), out = document.getElementById("natija");
  var chipsEl = document.getElementById("oylar"), filtr = 0;
  document.getElementById("note").textContent = cfg.i || "";

  var fmt = function (x) { return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };

  var barchaOy = [];
  cfg.n.forEach(function (n) { n.r.forEach(function (r) { if (barchaOy.indexOf(r[0]) < 0) barchaOy.push(r[0]); }); });
  barchaOy.sort(function (a, b) { return a - b; });
  function chips() {
    var html = '<button class="chip' + (filtr === 0 ? " on" : "") + '" data-oy="0">Hammasi</button>';
    barchaOy.forEach(function (o) { html += '<button class="chip' + (filtr === o ? " on" : "") + '" data-oy="' + o + '">' + o + " oy</button>"; });
    chipsEl.innerHTML = html;
  }
  chipsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    filtr = +b.dataset.oy; chips(); hisobla();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });

  function narx() { return +inp.value.replace(/\D/g, "") || 0; }

  function hisobla() {
    var p = narx();
    if (!cfg.n.length) { out.innerHTML = '<div class="empty">Hali nasiya foizlari kiritilmagan.<br>Admin botda ⚙️ Sozlamalar orqali kiritadi.</div>'; return; }
    if (p < 10000) { out.innerHTML = '<div class="empty">Narxni kiriting — har bir nasiya bo\'yicha oylik to\'lov shu yerda chiqadi.</div>'; return; }
    var q = cfg.q || 1000, eng = {}, soni = {};
    var data = cfg.n.map(function (n) {
      return { nomi: n.nomi, r: n.r.filter(function (r) { return !filtr || r[0] === filtr; }).map(function (r) {
        var oylik = Math.ceil(p * r[1] / r[0] / q) * q;
        soni[r[0]] = (soni[r[0]] || 0) + 1;
        if (!(r[0] in eng) || oylik < eng[r[0]]) eng[r[0]] = oylik;
        return { oy: r[0], oylik: oylik, jami: oylik * r[0] };
      }) };
    }).filter(function (n) { return n.r.length; });
    if (!data.length) { out.innerHTML = '<div class="empty">Bu muddat bo\'yicha nasiya yo\'q.</div>'; return; }
    out.innerHTML = data.map(function (n) {
      return '<div class="card"><h2>🏦 ' + esc(n.nomi) + "</h2>" + n.r.map(function (r) {
        var best = soni[r.oy] > 1 && eng[r.oy] === r.oylik ? ' <span class="best">ENG ARZON</span>' : "";
        return '<div class="row"><div class="oy">' + r.oy + ' oy</div><div class="oylik">' + fmt(r.oylik) +
          " <small>so'm/oy</small>" + best + '</div><div class="jami">jami<br>' + fmt(r.jami) + "</div></div>";
      }).join("") + "</div>";
    }).join("");
  }

  inp.addEventListener("input", function () {
    var v = narx(); inp.value = v ? fmt(v) : ""; hisobla();
  });
  chips(); hisobla(); inp.focus();

  function admin() {
    var namuna = 1000000, q = cfg.q || 1000;
    var fmtA = function (x) { return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); };
    var escA = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
    document.querySelector("main").className = "adm";
    document.querySelector("main").innerHTML =
      '<h1>💰 Ustama (foyda)</h1><div class="sub">Har nasiya uchun narxga qo\'shiladigan ustamamiz. Xodimlar buni ko\'rmaydi. ' +
      'Pastda 1 000 000 so\'mlik mahsulotga oylik to\'lov namunasi.</div><div id="list"></div>' +
      '<button class="save" id="save">Saqlash</button><div class="note">Saqlangach bot hammaga yangi tugma yuboradi.</div>';
    var list = document.getElementById("list");
    list.innerHTML = cfg.n.map(function (n, i) {
      return '<div class="card' + (n.on ? "" : " off") + '" id="c' + i + '"><h2><span>🏦 ' + escA(n.nomi) + '</span>' +
        '<label class="sw"><input type="checkbox" data-i="' + i + '"' + (n.on ? " checked" : "") + '><span></span></label></h2>' +
        '<div class="ust"><label>Bizning ustama</label><button class="step" data-i="' + i + '" data-d="-1">−</button>' +
        '<input inputmode="decimal" data-i="' + i + '" value="' + n.u + '"><button class="step" data-i="' + i + '" data-d="1">+</button>' +
        '<span style="font-weight:700">%</span></div><div class="fz" id="f' + i + '"></div></div>';
    }).join("");
    function preview(i) {
      var n = cfg.n[i], u = parseFloat(String(n.u).replace(",", ".")) || 0;
      document.getElementById("f" + i).innerHTML = n.f.length ? n.f.map(function (r) {
        var oylik = Math.ceil(namuna * (1 + u / 100) * (1 + r[1] / 100) / r[0] / q) * q;
        return r[0] + " oy (nasiya " + r[1] + "%): <b>" + fmtA(oylik) + "</b>/oy";
      }).join("<br>") : "Nasiya foizlari kiritilmagan";
    }
    cfg.n.forEach(function (_, i) { preview(i); });
    var dirty = false;
    function changed() {
      dirty = true;
      if (tg && tg.MainButton && tg.sendData) { tg.MainButton.setText("💾 Saqlash"); tg.MainButton.show(); }
      else document.getElementById("save").style.display = "block";
    }
    list.addEventListener("input", function (e) {
      var i = e.target.dataset.i; if (i === undefined) return;
      if (e.target.type === "checkbox") { cfg.n[i].on = e.target.checked; document.getElementById("c" + i).classList.toggle("off", !e.target.checked); }
      else { cfg.n[i].u = e.target.value; preview(i); }
      changed();
    });
    list.addEventListener("click", function (e) {
      var b = e.target.closest(".step"); if (!b) return;
      var i = b.dataset.i, n = cfg.n[i];
      var v = Math.max(0, Math.min(100, (parseFloat(String(n.u).replace(",", ".")) || 0) + (+b.dataset.d)));
      n.u = Math.round(v * 10) / 10;
      list.querySelector('input[inputmode][data-i="' + i + '"]').value = n.u;
      preview(i); changed();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    });
    function save() {
      var bad = cfg.n.filter(function (n) { var v = parseFloat(String(n.u).replace(",", ".")); return isNaN(v) || v < 0 || v > 100; });
      if (bad.length) { (tg && tg.showAlert) ? tg.showAlert("Ustama 0–100% oralig'ida bo'lsin: " + bad[0].nomi) : alert("0–100%"); return; }
      var d = { u: {}, on: {} };
      cfg.n.forEach(function (n) { d.u[n.k] = parseFloat(String(n.u).replace(",", ".")); d.on[n.k] = !!n.on; });
      if (tg && tg.sendData) tg.sendData(JSON.stringify(d));
    }
    if (tg && tg.MainButton) tg.MainButton.onClick(save);
    document.getElementById("save").addEventListener("click", save);
  }
})();
</script>
</body>
</html>
